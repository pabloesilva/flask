<!DOCTYPE html>
<html lang="es" data-bs-theme="{{ session.get('tema', 'light') }}">

<head>
  <meta charset="UTF-8" />
  <title>AGENDA CON FLASK CRUD 1.6</title>
  <link rel="stylesheet" href="https://bootswatch.com/5/brite/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  {% with messages = get_flashed_messages() %} {% if messages %}
  {% for message in messages %}
  <div class="alert alert-warning alert-dismissible fade show" role="alert">
    <strong>{{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endfor %}
  {% endif %} {% endwith %}
  <nav class="navbar navbar-expand-lg bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand">AGENDA</a>
      {% if session.get("user_id") %}
      <div class="d-flex">
        <div class="navbar-text pe-3 pt-2 ">{{ session.get("user_id") }}</div>
          
        <!-- SWITCH DE TEMA
        <div class="form-check form-switch me-3 mt-2 d-flex align-items-center gap-2">
          <input class="form-check-input" type="checkbox" id="temaSwitch"
                {% if session.get('tema', 'claro') == 'oscuro' %}checked{% endif %}>
          <i id="temaIcon"
            class="bi {% if session.get('tema', 'claro') == 'oscuro' %}bi-sun-fill{% else %}bi-moon-stars-fill{% endif %}"
            style="font-size: 1.2rem; color: #ffffff;"></i>
        </div> -->
        
        <div class="dropdown me-3">
          <button class="btn btn-primary dropdown-toggle" 
                  type="button" id="dropdownTema" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-circle-half"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownTema">
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="#" data-tema="light">
                <i class="bi bi-sun-fill"></i> Tema Claro
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2" href="#" data-tema="dark">
                <i class="bi bi-moon-stars-fill"></i> Tema Oscuro
              </a>
            </li>
          </ul>
        </div>


        <a href="{{url_for('logout')}}" class="btn btn-danger" type="submit">Salir</a>
      </div>
      {% endif %}
    </div>
  </nav>

  <style>
  .form-check-input:checked {
    background-color: #ffffff !important;
  }
  </style>

</head>

<body>
  <div class="container pt-4">
    {% block body %}
    {% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" 
          crossorigin="anonymous"></script>

  <script src="{{url_for('static', filename='js/main.js')}}"></script>

  
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const body = document.body;
    const opciones = document.querySelectorAll('.dropdown-item[data-tema]');
    const dropdownBtn = document.getElementById("dropdownTema");

    opciones.forEach(opcion => {
      opcion.addEventListener("click", (e) => {
        e.preventDefault();
        const nuevoTema = opcion.getAttribute("data-tema");

        // Cambiar tema global
        body.setAttribute("data-bs-theme", nuevoTema);

        // Guardar tema en sesión
        fetch("{{ url_for('cambiar_tema') }}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tema: nuevoTema })
        });
      });
    });
  });
</script>



</body>
</html>
