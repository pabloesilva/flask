{% extends "layout.html" %}
{% block body %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <div class="card-body">
        <h3 class="card-title text-center mb-4">Iniciar sesión</h3>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input autofocus name="usuario" id="usuario" placeholder="Ingrese su usuario" type="text"
                   class="form-control">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input name="password" id="password" placeholder="Ingrese su contraseña" type="password"
                   class="form-control">
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Aceptar</button>
          </div>

          <div class="mt-3 text-end">
            <a href="{{ url_for('registrar') }}" class="text-decoration-none">¿No tenés cuenta? Registrate</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
