{% extends "layout.html" %}
{% block body %}

<!-- contenedor full-height con posición relativa -->
<div style="position: relative; height: 100vh; width: 100%;">
  <!-- tarjeta centrada horizontalmente, con top al 50% y luego un translateY negativo menor al 50% -->
  <div style="
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -70%);
      max-width: 360px;
      width: 90%;
    ">
    <div class="card shadow">
      <div class="card-body d-flex flex-column align-items-center">

        <!-- Ícono decorativo -->
        <i class="bi bi-person-circle mb-3" style="font-size: 3rem; color: var(--bs-primary);"></i>

        <h3 class="card-title text-center mb-4">Iniciar sesión</h3>

        <form class="w-100" method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input autofocus name="usuario" id="usuario" placeholder="Ingrese su usuario" type="text"
                   class="form-control">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input name="password" id="password" placeholder="Ingrese su contraseña" type="password"
                   class="form-control">
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Aceptar</button>
          </div>

          <div class="mt-3 text-center w-100">
            <a href="{{ url_for('registrar') }}" class="text-decoration-none">¿No tenés cuenta? Registrate</a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
