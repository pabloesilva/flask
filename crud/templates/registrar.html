{% extends "layout.html" %}
{% block body %}

<div style="position: relative; height: 100vh; width: 100%;">
  <div style="
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -70%);
      max-width: 360px;
      width: 90%;
    ">
    <div class="card shadow">
      <div class="card-body d-flex flex-column align-items-center">

        <!-- Ícono decorativo para registro -->
        <i class="bi bi-pencil-square mb-3" style="font-size: 3rem; color: var(--bs-primary);"></i>

        <h3 class="card-title text-center mb-4">Registrarse</h3>

        <form class="w-100" method="POST" action="{{ url_for('registrar') }}">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input autofocus name="usuario" id="usuario" placeholder="Elegí un nombre de usuario" type="text"
                   class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input name="password" id="password" placeholder="Creá una contraseña segura" type="password"
                   class="form-control" required>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Crear cuenta</button>
          </div>

          <div class="mt-3 text-center w-100">
            <a href="{{ url_for('login') }}" class="text-decoration-none">¿Ya tenés cuenta? Iniciar sesión</a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
